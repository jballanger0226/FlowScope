# The FlowScope appliance asks cloud-init for its settings (host name, network, SSH keys) from wherever the platform provides them:
#   NoCloud / ConfigDrive   Nutanix AHV (Custom Script in Prism), OpenStack, and a "cidata" disk or ISO on any hypervisor
#   VMware / OVF            VMware ESXi and vCenter (vApp properties or guestinfo.* extra configuration)
# Without any of them the VM still starts: it asks for an address by DHCP on its first network adapter.
datasource_list: [ NoCloud, ConfigDrive, VMware, OVF, None ]
