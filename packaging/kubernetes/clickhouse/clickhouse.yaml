# ClickHouse for FlowScope: one server, one volume, reachable only inside the namespace.
# Pinned to the 25.8 LTS line the project is tested against.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: flowscope
  labels: { app.kubernetes.io/name: clickhouse }
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: clickhouse }
  template:
    metadata:
      labels: { app.kubernetes.io/name: clickhouse }
    spec:
      securityContext:
        fsGroup: 101                     # the "clickhouse" group of the official image
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.8
          env:
            - { name: CLICKHOUSE_USER, value: flowscope }
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: clickhouse-auth, key: password }
            - { name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1" }
          ports:
            - { name: http, containerPort: 8123, protocol: TCP }
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 30
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # storageClassName: vsphere-csi
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: flowscope
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: clickhouse }
  ports:
    - { name: http, port: 8123, targetPort: http, protocol: TCP }
