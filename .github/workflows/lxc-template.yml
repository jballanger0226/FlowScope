name: Proxmox container template
# Builds the FlowScope CT template (a .tar.zst you upload in the Proxmox web interface, see docs/deployment.md).
#   push to main  -> workflow artifact, and the rolling pre-release "template-latest"
#   tag v*        -> a normal GitHub release with the template attached
#   manual run    -> workflow artifact only
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "tools/**"
      - "package.json"
      - "packaging/lxc-template/**"
      - "packaging/proxmox/install.sh"
      - "packaging/linux/flowscope.service"
      - ".github/workflows/lxc-template.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  template:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install zstd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd
      - name: Build the template
        run: packaging/lxc-template/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: proxmox-ct-template
          path: template-out/*
          retention-days: 30

      # Boots the exported filesystem with systemd as PID 1 (privileged Docker is the closest thing to an LXC container on a runner)
      # and checks that the first-boot service and FlowScope come up. It cannot prove the template works on Proxmox itself.
      - name: Smoke test (boot with systemd)
        run: |
          set -euo pipefail
          f="$(ls template-out/*.tar.zst)"
          zstd -dc "$f" | docker import - flowscope-template:ci
          docker run -d --name tpl --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /run/lock \
            -p 18443:8443 flowscope-template:ci /sbin/init
          ok=0
          for i in $(seq 1 60); do
            if docker exec tpl systemctl is-active --quiet flowscope 2>/dev/null \
               && docker exec tpl env FLOWSCOPE_DATA_DIR=/var/lib/flowscope node --disable-warning=ExperimentalWarning /opt/flowscope/dist/src/cli.js healthcheck >/dev/null 2>&1; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" != 1 ]; then docker exec tpl systemctl status flowscope flowscope-firstboot --no-pager || true; docker exec tpl journalctl -u flowscope -u flowscope-firstboot --no-pager -n 80 || true; exit 1; fi
          docker exec tpl test -s /root/flowscope-admin-password.txt
          docker exec tpl sh -c '! grep -Eq "^FLOWSCOPE_ADMIN_PASSWORD=" /etc/flowscope/flowscope.env'
          docker exec tpl sh -c 'ls /etc/ssh/ssh_host_*_key >/dev/null'
          curl -ksf -o /dev/null https://localhost:18443/ && echo "web console answers"
          docker exec tpl flowscope-ctl version
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            gh release create "$GITHUB_REF_NAME" template-out/* --title "FlowScope $GITHUB_REF_NAME" --generate-notes
          else
            gh release view template-latest >/dev/null 2>&1 || gh release create template-latest --target "$GITHUB_SHA" --prerelease \
              --title "Proxmox template (latest main)" --notes "Rolling build of the Proxmox CT template from the main branch. Upload the .tar.zst in the Proxmox web interface; see docs/deployment.md."
            gh release upload template-latest template-out/* --clobber
            gh release edit template-latest --notes "Rolling build of the Proxmox CT template from the main branch (commit ${GITHUB_SHA::7}). Upload the .tar.zst in the Proxmox web interface; see docs/deployment.md."
          fi
