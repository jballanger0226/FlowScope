name: CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Linux and Windows treat all of 127.0.0.0/8 as loopback, macOS only configures 127.0.0.1. The SNMP tests run simulated
      # devices on 127.0.0.2 and discovery scans up to 127.0.0.3, so add them (on a Mac at your desk: the same two commands).
      - name: Extra loopback addresses (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo ifconfig lo0 alias 127.0.0.2 up
          sudo ifconfig lo0 alias 127.0.0.3 up
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  clickhouse:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        ports: ["8123:8123"]
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping"
          --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: node tools/build.mjs
      - run: node --test --test-concurrency=1 dist/test/clickhouse.test.js
        env:
          FLOWSCOPE_TEST_CLICKHOUSE: http://127.0.0.1:8123

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for f in packaging/docker-entrypoint.sh packaging/linux/install.sh packaging/linux/clickhouse-setup.sh packaging/macos/install.sh packaging/proxmox/*.sh packaging/lxc-template/build.sh packaging/lxc-template/rootfs/usr/local/sbin/flowscope-firstboot; do bash -n "$f" && echo "ok $f"; done
      - name: Compose files
        run: |
          printf 'CLICKHOUSE_PASSWORD=ciPassword123\n' > .env
          for f in docker-compose.yml docker-compose.host.yml docker-compose.sqlite.yml docker-compose.host.sqlite.yml; do docker compose -f "$f" config -q && echo "ok $f"; done
          rm .env
      - name: ShellCheck
        run: sudo apt-get install -y -qq shellcheck && shellcheck -S warning packaging/docker-entrypoint.sh packaging/linux/clickhouse-setup.sh packaging/proxmox/*.sh packaging/lxc-template/build.sh packaging/lxc-template/rootfs/usr/local/sbin/flowscope-firstboot

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flowscope:ci .
      - name: Entrypoint hands a root-owned folder to the unprivileged user (Proxmox mount points, new bind mounts)
        run: |
          sudo mkdir /tmp/rootdata && sudo chown root:root /tmp/rootdata
          docker run -d --name fsroot -e FLOWSCOPE_ADMIN_PASSWORD='ci-password-12345' -v /tmp/rootdata:/data flowscope:ci
          for i in $(seq 1 40); do [ "$(docker inspect -f '{{.State.Health.Status}}' fsroot)" = healthy ] && break; sleep 3; done
          test "$(docker inspect -f '{{.State.Health.Status}}' fsroot)" = healthy
          test "$(stat -c %u /tmp/rootdata)" = 1000
          docker exec fsroot sh -c 'test "$(id -u $(ps -o user= -p 1 2>/dev/null || echo node))" != 0 || true'
          # docker top needs the pid column in the ps output it parses ("Couldn't find PID field"), so ask for pid,user and look at user.
          docker top fsroot -eo pid,user | tail -n +2 | awk '{print $2}' | grep -qv '^root'
      - name: Starts directly as another user
        run: |
          mkdir /tmp/userdata && sudo chown 1000:1000 /tmp/userdata
          docker run -d --name fsuser --user 1000:1000 -e FLOWSCOPE_ADMIN_PASSWORD='ci-password-12345' -v /tmp/userdata:/data flowscope:ci
          for i in $(seq 1 40); do [ "$(docker inspect -f '{{.State.Health.Status}}' fsuser)" = healthy ] && exit 0; sleep 3; done
          docker logs fsuser; exit 1
      - name: Start and wait for the health check
        run: |
          docker run -d --name fs -e FLOWSCOPE_ADMIN_PASSWORD='ci-password-12345' -p 8443:443 flowscope:ci
          for i in $(seq 1 40); do
            s=$(docker inspect -f '{{.State.Health.Status}}' fs)
            echo "health: $s"; [ "$s" = healthy ] && exit 0; sleep 3
          done
          docker logs fs; exit 1
