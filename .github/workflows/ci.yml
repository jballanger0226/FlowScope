name: CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  clickhouse:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        ports: ["8123:8123"]
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping"
          --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: node tools/build.mjs
      - run: node --test --test-concurrency=1 dist/test/clickhouse.test.js
        env:
          FLOWSCOPE_TEST_CLICKHOUSE: http://127.0.0.1:8123

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for f in packaging/docker-entrypoint.sh packaging/linux/install.sh packaging/macos/install.sh packaging/proxmox/*.sh; do bash -n "$f" && echo "ok $f"; done
      - name: ShellCheck
        run: sudo apt-get install -y -qq shellcheck && shellcheck -S warning packaging/docker-entrypoint.sh packaging/proxmox/*.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flowscope:ci .
      - name: Entrypoint hands a root-owned folder to the unprivileged user (Proxmox mount points, new bind mounts)
        run: |
          sudo mkdir /tmp/rootdata && sudo chown root:root /tmp/rootdata
          docker run -d --name fsroot -e FLOWSCOPE_ADMIN_PASSWORD='ci-password-12345' -v /tmp/rootdata:/data flowscope:ci
          for i in $(seq 1 40); do [ "$(docker inspect -f '{{.State.Health.Status}}' fsroot)" = healthy ] && break; sleep 3; done
          test "$(docker inspect -f '{{.State.Health.Status}}' fsroot)" = healthy
          test "$(stat -c %u /tmp/rootdata)" = 1000
          docker exec fsroot sh -c 'test "$(id -u $(ps -o user= -p 1 2>/dev/null || echo node))" != 0 || true'
          docker top fsroot -o user | tail -n +2 | grep -qv '^root'
      - name: Starts directly as another user
        run: |
          mkdir /tmp/userdata && sudo chown 1000:1000 /tmp/userdata
          docker run -d --name fsuser --user 1000:1000 -e FLOWSCOPE_ADMIN_PASSWORD='ci-password-12345' -v /tmp/userdata:/data flowscope:ci
          for i in $(seq 1 40); do [ "$(docker inspect -f '{{.State.Health.Status}}' fsuser)" = healthy ] && exit 0; sleep 3; done
          docker logs fsuser; exit 1
      - name: Start and wait for the health check
        run: |
          docker run -d --name fs -e FLOWSCOPE_ADMIN_PASSWORD='ci-password-12345' -p 8443:8443 flowscope:ci
          for i in $(seq 1 40); do
            s=$(docker inspect -f '{{.State.Health.Status}}' fs)
            echo "health: $s"; [ "$s" = healthy ] && exit 0; sleep 3
          done
          docker logs fs; exit 1
