# FlowScope on the host's network, for when exporters must be identified by their real address.
#
#   cp .env.example .env   (set CLICKHOUSE_PASSWORD, letters and digits only)
#   docker compose -f docker-compose.host.yml up -d
#
# With the default bridge network (docker-compose.yml) Docker publishes the UDP ports, and flow packets from other machines keep their source
# address. Packets that come from the Docker host itself, or through some firewall/NAT setups and rootless Docker, arrive from the bridge
# address instead, and then every exporter looks like the same device. Host networking avoids that. It does not work on Docker Desktop
# for Windows or macOS (use the bridge file there).
#
# ClickHouse (the default storage) runs beside it and is published on the host's loopback address only (127.0.0.1:8123), which is how FlowScope,
# sharing the host's network, reaches it. Without ClickHouse (embedded SQLite, nothing more to download):
#   docker compose -f docker-compose.host.sqlite.yml up -d
services:
  flowscope:
    build: .
    image: flowscope:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - flowscope-data:/data
    environment:
      FLOWSCOPE_ADMIN_PASSWORD: ${FLOWSCOPE_ADMIN_PASSWORD:-}
      # Ports are the settings below, not a "ports:" list, because the container uses the host's network directly.
      FLOWSCOPE_HTTPS_PORT: ${FLOWSCOPE_HTTPS_PORT:-443}
      FLOWSCOPE_FLOW_PORTS: ${FLOWSCOPE_FLOW_PORTS:-2055,4739}
      FLOWSCOPE_CLICKHOUSE_URL: ${FLOWSCOPE_CLICKHOUSE_URL:-http://flowscope:${CLICKHOUSE_PASSWORD:-}@127.0.0.1:8123/flowscope}
      FLOWSCOPE_BACKEND: ${FLOWSCOPE_BACKEND:-clickhouse}
    depends_on:
      clickhouse:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123/tcp"   # loopback only; change the host port here and in FLOWSCOPE_CLICKHOUSE_URL if 8123 is taken
    environment:
      CLICKHOUSE_USER: flowscope
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  flowscope-data:
  clickhouse-data:
